<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SourceHub Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  .hide { display: none !important; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

<!-- ============ TOP NAV ============ -->
<nav class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="font-bold text-lg">⚡ SourceHub</div>
    <div class="flex-1"></div>
    <input id="searchInput" placeholder="Search products…" class="hidden md:block px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm w-64" />
    <button onclick="toggleDark()" class="px-2 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm">🌓</button>
    <div id="navAuth" class="flex items-center gap-2"></div>
  </div>
  <div class="max-w-6xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto text-sm">
    <button data-tab="home" class="tab-btn px-3 py-1.5 rounded-lg">Home</button>
    <button data-tab="wallet" class="tab-btn px-3 py-1.5 rounded-lg">Wallet</button>
    <button data-tab="purchases" class="tab-btn px-3 py-1.5 rounded-lg">Purchases</button>
    <button data-tab="referral" class="tab-btn px-3 py-1.5 rounded-lg">Referral</button>
    <button data-tab="profile" class="tab-btn px-3 py-1.5 rounded-lg">Profile</button>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-6">

  <!-- ============ AUTH ============ -->
  <section id="authView" class="hide">
    <div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-2xl p-6 shadow">
      <div class="flex gap-2 mb-4">
        <button id="loginTab" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white">Login</button>
        <button id="registerTab" class="flex-1 py-2 rounded-lg bg-slate-100 dark:bg-slate-800">Register</button>
      </div>
      <form id="authForm" class="space-y-3">
        <input id="aName" placeholder="Full Name" class="hide w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="aEmail" type="email" placeholder="Email" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="aPass" type="password" placeholder="Password (6+ chars)" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="aRef" placeholder="Referral code (optional)" class="hide w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <button id="authSubmit" class="w-full py-2 rounded-lg bg-indigo-600 text-white font-medium">Login</button>
        <p id="authMsg" class="text-sm text-red-500"></p>
      </form>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="homeView" class="hide">
    <div class="mb-4 flex gap-2 overflow-x-auto" id="catBar"></div>
    <div id="productGrid" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <!-- ============ WALLET ============ -->
  <section id="walletView" class="hide space-y-4">
    <div class="bg-gradient-to-br from-indigo-600 to-purple-600 text-white rounded-2xl p-6">
      <div class="text-sm opacity-80">Balance</div>
      <div class="text-3xl font-bold" id="walletBalance">0 PKR</div>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow">
      <h3 class="font-semibold mb-3">Add Balance</h3>
      <form id="depositForm" class="space-y-3">
        <select id="dMethod" class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800">
          <option>EasyPaisa</option><option>JazzCash</option>
        </select>
        <input id="dAmount" type="number" min="1" placeholder="Amount (PKR)" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="dTxn" placeholder="Transaction ID" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="dShot" type="file" accept="image/*" class="w-full text-sm" />
        <p class="text-xs opacity-60">Screenshot is uploaded to ImgBB.</p>
        <button class="w-full py-2 rounded-lg bg-emerald-600 text-white font-medium">Submit Deposit</button>
      </form>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow">
      <h3 class="font-semibold mb-3">Deposit History</h3>
      <div id="depositList" class="space-y-2 text-sm"></div>
    </div>
  </section>

  <!-- ============ PURCHASES ============ -->
  <section id="purchasesView" class="hide">
    <h2 class="text-xl font-bold mb-3">My Purchases</h2>
    <div id="purchaseList" class="space-y-3"></div>
  </section>

  <!-- ============ REFERRAL ============ -->
  <section id="referralView" class="hide">
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow text-center">
      <div class="text-sm opacity-70">Your Referral Code</div>
      <div id="refCode" class="text-3xl font-bold mt-2 tracking-widest">—</div>
      <button onclick="copyRef()" class="mt-3 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Copy</button>
      <p class="text-sm opacity-70 mt-4">Share your code. You earn rewards when friends sign up.</p>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow mt-4">
      <h3 class="font-semibold mb-2">Redeem Promo Code</h3>
      <form id="promoForm" class="flex gap-2">
        <input id="promoInput" placeholder="WELCOME100" class="flex-1 px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <button class="px-4 py-2 rounded-lg bg-emerald-600 text-white">Redeem</button>
      </form>
      <p id="promoMsg" class="text-sm mt-2"></p>
    </div>
  </section>

  <!-- ============ PROFILE ============ -->
  <section id="profileView" class="hide space-y-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow">
      <div class="font-bold text-lg" id="pName">—</div>
      <div class="text-sm opacity-70" id="pEmail">—</div>
      <div class="text-sm mt-2">Balance: <span id="pBal">0</span> PKR</div>
      <div class="text-sm">Referral: <span id="pRef">—</span></div>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow">
      <h3 class="font-semibold mb-3">Change Password</h3>
      <form id="pwForm" class="space-y-3">
        <input id="oldPw" type="password" placeholder="Old password" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="newPw" type="password" placeholder="New password" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <input id="newPw2" type="password" placeholder="Confirm new password" required class="w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800" />
        <button class="w-full py-2 rounded-lg bg-indigo-600 text-white">Confirm</button>
        <p id="pwMsg" class="text-sm"></p>
      </form>
    </div>
  </section>

</main>

<!-- ============ PRODUCT MODAL ============ -->
<div id="modal" class="hide fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white dark:bg-slate-900 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto">
    <div id="modalBody" class="p-5"></div>
  </div>
</div>

<!-- ============ FIREBASE ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, updateProfile,
  EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, collection,
  addDoc, query, where, orderBy, onSnapshot, serverTimestamp,
  runTransaction, getDocs, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔧 REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDiw9Lkblug95sFXQIXQB4p6mWePdMvyWE",
  authDomain: "paw-pro-589ab.firebaseapp.com",
  databaseURL: "https://paw-pro-589ab-default-rtdb.firebaseio.com",
  projectId: "paw-pro-589ab",
  storageBucket: "paw-pro-589ab.firebasestorage.app",
  messagingSenderId: "931588466367",
  appId: "1:931588466367:web:71d47d147abbf55c4b480a"
};

// 🔧 REPLACE WITH YOUR IMGBB API KEY  → https://api.imgbb.com/
const IMGBB_API_KEY = "a6ce6bb637ef5779b739760f6846f4eb";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- ImgBB upload helper ----------
async function uploadToImgBB(file) {
  if (!file) return null;
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:'POST', body: fd });
  const j = await res.json();
  if (!j.success) throw new Error(j.error?.message || 'ImgBB upload failed');
  return j.data.url;
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hide');
const hide = id => $(id).classList.add('hide');
const VIEWS = ['authView','homeView','walletView','purchasesView','referralView','profileView'];
function switchView(name) {
  VIEWS.forEach(v => hide(v));
  show(name + 'View');
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('bg-indigo-600', b.dataset.tab === name);
    b.classList.toggle('text-white', b.dataset.tab === name);
  });
}
document.querySelectorAll('.tab-btn').forEach(b =>
  b.addEventListener('click', () => { if (auth.currentUser) switchView(b.dataset.tab); })
);

window.toggleDark = () => document.documentElement.classList.toggle('dark');

// ---------- auth tabs ----------
let isLogin = true;
const loginTab = $('loginTab'), regTab = $('registerTab');
function setAuthMode(login) {
  isLogin = login;
  loginTab.classList.toggle('bg-indigo-600', login);
  loginTab.classList.toggle('text-white', login);
  loginTab.classList.toggle('bg-slate-100', !login);
  regTab.classList.toggle('bg-indigo-600', !login);
  regTab.classList.toggle('text-white', !login);
  regTab.classList.toggle('bg-slate-100', login);
  $('aName').classList.toggle('hide', login);
  $('aRef').classList.toggle('hide', login);
  $('authSubmit').textContent = login ? 'Login' : 'Create Account';
}
loginTab.onclick = () => setAuthMode(true);
regTab.onclick = () => setAuthMode(false);
setAuthMode(true);

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('authMsg').textContent = '';
  const email = $('aEmail').value.trim(), pw = $('aPass').value;
  try {
    if (isLogin) {
      await signInWithEmailAndPassword(auth, email, pw);
    } else {
      const name = $('aName').value.trim() || 'User';
      const refUsed = $('aRef').value.trim().toUpperCase();
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(cred.user, { displayName: name });
      // unique referral code
      let code, exists = true;
      while (exists) {
        code = (name.replace(/\s/g,'').slice(0,3).toUpperCase() || 'USR')
          + Math.floor(100+Math.random()*900);
        const dup = await getDocs(query(collection(db,'users'), where('referralCode','==',code)));
        exists = !dup.empty;
      }
      await setDoc(doc(db,'users',cred.user.uid), {
        name, email, balance: 0, referralCode: code,
        referredBy: refUsed || null, isBanned: false,
        createdAt: serverTimestamp()
      });
    }
  } catch (err) { $('authMsg').textContent = err.message; }
});

// ---------- auth state ----------
let userDoc = null, userUnsub = null, purchasedIds = new Set();
onAuthStateChanged(auth, async user => {
  if (userUnsub) { userUnsub(); userUnsub = null; }
  if (!user) {
    userDoc = null;
    $('navAuth').innerHTML = '';
    switchView('auth');
    return;
  }
  $('navAuth').innerHTML = `<button id="logoutBtn" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm">Logout</button>`;
  $('logoutBtn').onclick = () => signOut(auth);
  userUnsub = onSnapshot(doc(db,'users',user.uid), snap => {
    userDoc = snap.data() || {};
    if (userDoc.isBanned) { alert('Your account is banned.'); signOut(auth); return; }
    renderProfile();
  });
  switchView('home');
  loadProducts();
  watchPurchases();
  watchDeposits();
});

// ---------- products ----------
let allProducts = [], activeCat = 'All';
function loadProducts() {
  onSnapshot(query(collection(db,'products'), orderBy('createdAt','desc')), snap => {
    allProducts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderCats(); renderProducts();
  });
}
function renderCats() {
  const cats = ['All', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
  $('catBar').innerHTML = cats.map(c =>
    `<button data-cat="${c}" class="px-3 py-1.5 rounded-full text-sm whitespace-nowrap ${c===activeCat?'bg-indigo-600 text-white':'bg-slate-200 dark:bg-slate-800'}">${c}</button>`
  ).join('');
  $('catBar').querySelectorAll('button').forEach(b =>
    b.onclick = () => { activeCat = b.dataset.cat; renderCats(); renderProducts(); }
  );
}
$('searchInput').addEventListener('input', renderProducts);
function renderProducts() {
  const q = ($('searchInput').value || '').toLowerCase();
  const list = allProducts.filter(p =>
    (activeCat==='All' || p.category===activeCat) &&
    (!q || (p.name||'').toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q))
  ).sort((a,b)=>((b.featured?1:0)-(a.featured?1:0)));
  $('productGrid').innerHTML = list.map(p => `
    <div class="bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow hover:shadow-lg transition cursor-pointer" onclick="openProduct('${p.id}')">
      ${p.reviewImage ? `<img src="${p.reviewImage}" class="w-full h-40 object-cover">` : `<div class="h-40 bg-gradient-to-br from-indigo-500 to-purple-600"></div>`}
      <div class="p-3">
        <div class="font-semibold truncate">${p.name||'Untitled'} ${p.featured?'<span class="text-xs bg-amber-500 text-white px-1.5 py-0.5 rounded ml-1">★</span>':''}</div>
        <div class="text-xs opacity-60 truncate">${p.category||''}</div>
        <div class="mt-2 flex items-center justify-between">
          <span class="font-bold ${!p.isPaid?'text-emerald-600':'text-indigo-600'}">${!p.isPaid?'FREE':(p.price||0)+' PKR'}</span>
          <span class="text-xs opacity-60">${p.views||0} 👁 · ${p.downloads||0} ⬇</span>
        </div>
      </div>
    </div>`).join('') || `<p class="opacity-60">No products yet.</p>`;
}

window.openProduct = async id => {
  const p = allProducts.find(x => x.id===id); if (!p) return;
  // increment views
  updateDoc(doc(db,'products',id), { views: increment(1) }).catch(()=>{});
  const isGroup = p.category === 'WhatsApp Group' || p.category === 'WhatsApp Group Access';
  const owned = purchasedIds.has(id) || !p.isPaid;
  const btnLabel = owned
    ? (isGroup ? 'Open Download Link' : 'Open Download Link')
    : (isGroup ? `Buy Access (${p.price||0} PKR)` : `Buy Now (${p.price||0} PKR)`);
  const action = owned
    ? (isGroup ? `openGroup('${p.id}')` : `openLink('${p.id}')`)
    : (isGroup ? `buyGroup('${p.id}')` : `buyProduct('${p.id}')`);
  $('modalBody').innerHTML = `
    ${p.reviewImage?`<img src="${p.reviewImage}" class="w-full h-48 object-cover rounded-xl mb-3">`:''}
    <h2 class="text-xl font-bold">${p.name}</h2>
    <div class="text-sm opacity-70 mb-2">${p.category||''} · ${p.linkType||''}</div>
    <div class="text-lg font-bold mb-3 ${!p.isPaid?'text-emerald-600':'text-indigo-600'}">${!p.isPaid?'FREE':(p.price||0)+' PKR'}</div>
    <p class="text-sm whitespace-pre-wrap mb-3">${p.description||''}</p>
    <div class="flex gap-2">
      <button onclick="closeModal()" class="flex-1 py-2 rounded-lg bg-slate-200 dark:bg-slate-800">Close</button>
      <button onclick="${action}" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white">${btnLabel}</button>
    </div>`;
  show('modal');
};
window.closeModal = () => hide('modal');
$('modal').addEventListener('click', e => { if (e.target.id==='modal') hide('modal'); });

window.openLink = id => {
  const p = allProducts.find(x=>x.id===id);
  if (p?.downloadLink) window.open(p.downloadLink, '_blank');
  else alert('No link available.');
};

// ---------- buy / download ----------
window.buyProduct = async id => {
  const p = allProducts.find(x=>x.id===id); if (!p) return;
  const u = auth.currentUser; if (!u) return;
  try {
    if (p.isPaid) {
      await runTransaction(db, async t => {
        const uref = doc(db,'users',u.uid);
        const usnap = await t.get(uref);
        const bal = usnap.data().balance || 0;
        if (bal < (p.price||0)) throw new Error('Insufficient balance. Please deposit.');
        t.update(uref, { balance: bal - (p.price||0) });
        const pref = doc(collection(db,'purchases'));
        t.set(pref, { userId:u.uid, productId:id, productName:p.name, price:p.price||0,
          reviewImage:p.reviewImage||null, description:p.description||'',
          linkType:p.linkType||null, downloadLink:p.downloadLink||null,
          purchaseDate: serverTimestamp() });
      });
    } else {
      await addDoc(collection(db,'purchases'), {
        userId:u.uid, productId:id, productName:p.name, price:0,
        reviewImage:p.reviewImage||null, description:p.description||'',
        linkType:p.linkType||null, downloadLink:p.downloadLink||null,
        purchaseDate: serverTimestamp()
      });
    }
    await updateDoc(doc(db,'products',id), { downloads: increment(1) });
    if (p.downloadLink) window.open(p.downloadLink, '_blank');
    closeModal();
    alert('Success! Check Purchases tab.');
  } catch (e) { alert(e.message); }
};

window.openGroup = id => {
  const p = allProducts.find(x=>x.id===id);
  if (p?.downloadLink) window.open(p.downloadLink, '_blank');
  else alert('Awaiting admin to add you to the group.');
};

window.buyGroup = async id => {
  const p = allProducts.find(x=>x.id===id); if (!p) return;
  const u = auth.currentUser;
  const wa = prompt('Enter your WhatsApp number (e.g. +923001234567):');
  if (!wa) return;
  try {
    await runTransaction(db, async t => {
      const uref = doc(db,'users',u.uid);
      const usnap = await t.get(uref);
      const bal = usnap.data().balance || 0;
      if (p.isPaid && bal < (p.price||0)) throw new Error('Insufficient balance.');
      if (p.isPaid) t.update(uref, { balance: bal - (p.price||0) });
      const rref = doc(collection(db,'group_requests'));
      t.set(rref, {
        userId:u.uid, userName:usnap.data().name, groupId:id, groupName:p.name,
        whatsappNumber:wa, status:'pending', price:p.price||0,
        createdAt: serverTimestamp()
      });
      const pref = doc(collection(db,'purchases'));
      t.set(pref, { userId:u.uid, productId:id, productName:p.name, price:p.price||0,
        type:'group', reviewImage:p.reviewImage||null, description:p.description||'',
        linkType:p.linkType||null, downloadLink:p.downloadLink||null,
        purchaseDate: serverTimestamp() });
    });
    closeModal();
    alert('Request submitted. Admin will add you to the group shortly.');
  } catch (e) { alert(e.message); }
};

// ---------- wallet / deposits ----------
$('depositForm').addEventListener('submit', async e => {
  e.preventDefault();
  const u = auth.currentUser; if (!u) return;
  const amt = +$('dAmount').value, method = $('dMethod').value, txn = $('dTxn').value.trim();
  const file = $('dShot').files[0];
  let url = null;
  try {
    if (file) url = await uploadToImgBB(file);
    await addDoc(collection(db,'deposits'), {
      userId:u.uid, userName:userDoc?.name||'', amount:amt, method,
      transactionId:txn, screenshot:url, status:'pending', createdAt: serverTimestamp()
    });
    e.target.reset(); alert('Deposit submitted. Awaiting admin approval.');
  } catch (err) { alert(err.message); }
});

function watchDeposits() {
  const u = auth.currentUser; if (!u) return;
  onSnapshot(query(collection(db,'deposits'), where('userId','==',u.uid)), snap => {
    const items = snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $('depositList').innerHTML = items.map(d => `
      <div class="flex justify-between border-b border-slate-200 dark:border-slate-800 pb-2">
        <div><div>${d.amount} PKR · ${d.method}</div><div class="opacity-60 text-xs">${d.transactionId||''}</div></div>
        <span class="text-xs px-2 py-1 rounded-full ${d.status==='approved'?'bg-emerald-100 text-emerald-700':d.status==='rejected'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${d.status}</span>
      </div>`).join('') || '<p class="opacity-60">No deposits.</p>';
  });
}

// ---------- purchases ----------
function watchPurchases() {
  const u = auth.currentUser; if (!u) return;
  onSnapshot(query(collection(db,'purchases'), where('userId','==',u.uid)), snap => {
    const items = snap.docs.map(d=>d.data()).sort((a,b)=>(b.purchaseDate?.seconds||0)-(a.purchaseDate?.seconds||0));
    purchasedIds = new Set(items.map(p=>p.productId));
    $('purchaseList').innerHTML = items.map(p => `
      <div class="bg-white dark:bg-slate-900 rounded-xl p-3 shadow flex items-center gap-3">
        ${p.reviewImage?`<img src="${p.reviewImage}" class="w-16 h-16 rounded-lg object-cover">`:`<div class="w-16 h-16 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600"></div>`}
        <div class="flex-1 min-w-0">
          <div class="font-semibold truncate">${p.productName||'Product'}</div>
          <div class="text-xs opacity-60 truncate">${p.description||''}</div>
          <div class="text-xs">${p.price||0} PKR · ${p.type==='group'?'WhatsApp Group':(p.linkType||'Digital')}</div>
        </div>
        ${p.downloadLink?`<a href="${p.downloadLink}" target="_blank" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm whitespace-nowrap">Open Link</a>`:`<span class="text-xs opacity-60">Pending</span>`}
      </div>`).join('') || '<p class="opacity-60">No purchases yet.</p>';
  });
}

// ---------- referral / promo ----------
window.copyRef = () => { navigator.clipboard.writeText($('refCode').textContent); alert('Copied!'); };
$('promoForm').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('promoInput').value.trim().toUpperCase();
  const u = auth.currentUser; if (!u) return;
  try {
    const pref = doc(db,'promoCodes',code);
    await runTransaction(db, async t => {
      const ps = await t.get(pref);
      if (!ps.exists()) throw new Error('Invalid code');
      const d = ps.data();
      if (d.active === false) throw new Error('Code disabled');
      const usedBy = d.usedBy || [];
      if (usedBy.includes(u.uid)) throw new Error('Already used');
      t.update(pref, { usedBy: [...usedBy, u.uid] });
      t.update(doc(db,'users',u.uid), { balance: increment(d.reward||0) });
    });
    $('promoMsg').textContent = '✅ Reward added!';
    $('promoMsg').className = 'text-sm mt-2 text-emerald-600';
  } catch (err) {
    $('promoMsg').textContent = err.message;
    $('promoMsg').className = 'text-sm mt-2 text-red-500';
  }
});

// ---------- profile ----------
function renderProfile() {
  if (!userDoc) return;
  $('walletBalance').textContent = (userDoc.balance||0) + ' PKR';
  $('refCode').textContent = userDoc.referralCode || '—';
  $('pName').textContent = userDoc.name||'';
  $('pEmail').textContent = userDoc.email||'';
  $('pBal').textContent = userDoc.balance||0;
  $('pRef').textContent = userDoc.referralCode||'';
}

$('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const u = auth.currentUser;
  const oldP = $('oldPw').value, n1 = $('newPw').value, n2 = $('newPw2').value;
  if (n1 !== n2) return $('pwMsg').textContent = 'New passwords do not match.';
  try {
    const cred = EmailAuthProvider.credential(u.email, oldP);
    await reauthenticateWithCredential(u, cred);
    await updatePassword(u, n1);
    $('pwMsg').textContent = '✅ Password updated.';
    $('pwMsg').className = 'text-sm text-emerald-600';
    e.target.reset();
  } catch (err) { $('pwMsg').textContent = err.message; $('pwMsg').className='text-sm text-red-500'; }
});
</script>
