<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid #00ff88;
      border-radius: 50px;
      color: #00ff88;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(45px, 10vw, 90px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    h1 span {
      color: #00ff88;
      text-shadow: 0 0 25px #00ff88;
    }

    p {
      color: #aaa;
      font-size: 18px;
      line-height: 1.6;
      max-width: 550px;
      margin: auto;
    }

    .loader {
      width: 55px;
      height: 55px;
      margin: 35px auto 0;
      border: 3px solid #222;
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(0,255,136,.3);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .glow {
      position: fixed;
      width: 350px;
      height: 350px;
      background: #00ff88;
      filter: blur(180px);
      opacity: .08;
      border-radius: 50%;
      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="container">
    <div class="badge">STAY TUNED</div>

    <h1>Something <span>Big</span><br>Is Coming Soon</h1>

    <p>
      We are working on something exciting for you.
      Stay tuned and get ready for the next big update.
    </p>

    <div class="loader"></div>
  </div>

</body>
</html>
